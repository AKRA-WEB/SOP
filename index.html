            const breadcrumb = document.getElementById('breadcrumb');
            if (currentModuleId === 'dashboard') {
                breadcrumb.innerHTML = `<span class="text-slate-900 font-medium">Home</span>`;
            } else if (currentModuleId.startsWith('wms-')) {
                // หากอยู่ในหน้าย่อย WMS ให้แสดง Breadcrumb แบบลึก (Home > WMS > หน้าปัจจุบัน)
                breadcrumb.innerHTML = `
                    <span class="hover:text-slate-900 cursor-pointer transition-colors" onclick="navigate('dashboard')">Home</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 mx-2"></i>
                    <span class="hover:text-slate-900 cursor-pointer transition-colors" onclick="navigate('wms')">${TUTORIAL_MODULES['wms'].title}</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 mx-2"></i>
                    <span class="text-slate-900 font-medium">${TUTORIAL_MODULES[currentModuleId].title}</span>
                `;
            } else {
                breadcrumb.innerHTML = `
                    <span class="hover:text-slate-900 cursor-pointer transition-colors" onclick="navigate('dashboard')">Home</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 mx-2"></i>
                    <span class="text-slate-900 font-medium">${TUTORIAL_MODULES[currentModuleId].title}</span>
                `;
            }
        }

        function renderDashboard() {
            let cardsHtml = '';
            NAV_ITEMS.forEach(id => {
                const item = TUTORIAL_MODULES[id];
                cardsHtml += `
                    <div onclick="navigate('${id}')" class="group bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md hover:border-slate-300 transition-all cursor-pointer">
                        <div class="w-12 h-12 rounded-xl bg-slate-50 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                            <i data-lucide="${item.icon}" class="w-6 h-6 text-slate-700"></i>
                        </div>
                        <h3 class="text-xl font-semibold text-slate-900 mb-2">${item.title}</h3>
                        <p class="text-slate-500 text-sm mb-4 line-clamp-2">${item.description}</p>
                        <div class="flex items-center text-sm font-medium text-amber-600">
                            เริ่มเรียนรู้ <i data-lucide="chevron-right" class="w-4 h-4 ml-1"></i>
                        </div>
                    </div>
                `;
            });

            return `
                <div class="max-w-4xl mx-auto animate-fade-in">
                    <div class="text-center mb-12">
                        <h2 class="text-3xl font-bold text-slate-900 mb-4">ยินดีต้อนรับสู่ศูนย์การเรียนรู้</h2>
                        <p class="text-lg text-slate-600">กรุณาเลือกระบบที่คุณต้องการเรียนรู้วิธีการใช้งานจากรายการด้านล่าง</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        ${cardsHtml}
                    </div>
                </div>
            `;
        }

        function renderModuleContent() {
            const data = TUTORIAL_MODULES[currentModuleId];
            return `
                <div class="max-w-4xl mx-auto animate-fade-in">
                    <!-- Header Section -->
                    <div class="bg-white rounded-2xl p-6 sm:p-8 border border-slate-200 shadow-sm mb-6 hidden md:block">
                        <div class="flex items-center gap-4">
                            <div class="w-14 h-14 rounded-xl bg-slate-900 flex items-center justify-center shadow-inner shrink-0">
                                <i data-lucide="${data.icon}" class="w-7 h-7 text-amber-400"></i>
                            </div>
                            <div>
                                <h1 class="text-2xl sm:text-3xl font-bold text-slate-900">${data.title}</h1>
                                <p class="text-slate-500 mt-1">${data.description}</p>
                            </div>
                        </div>
                    </div>

                    <!-- Dynamic Content -->
                    <div class="min-h-[400px]">
                        ${data.content}
                    </div>
                </div>
            `;
        }

        // ==========================================
        // 3. INITIALIZATION & NAVIGATION
        // ==========================================

        function navigate(id) {
            currentModuleId = id;
            
            // Re-render UI components
            renderSidebarMenu();
            renderBreadcrumb();
            
            const mainContent = document.getElementById('main-content');
            if (id === 'dashboard') {
                mainContent.innerHTML = renderDashboard();
            } else {
                mainContent.innerHTML = renderModuleContent();
            }

            // Important: Re-initialize Lucide icons for newly injected HTML
            lucide.createIcons();

            // Close sidebar on mobile after navigation
            if (window.innerWidth < 1024) { // lg breakpoint
                toggleSidebar(false);
            }
            
            // Scroll to top
            document.getElementById('main-content').scrollTop = 0;
        }

        // Initialize app on load
        document.addEventListener('DOMContentLoaded', () => {
            navigate('dashboard');
        });

    </script>
</body>
</html>
